name: ROS backend build and interface verification (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        shell: bash
        run: |
          apt-get update
          apt-get install -y sudo git build-essential cmake libusb-1.0-0-dev libboost-program-options-dev python3-colcon-common-extensions python3-rosdep python3-numpy python3-scipy python3-yaml python3-matplotlib python3-venv python3-pip ros-jazzy-tf-transformations ros-jazzy-rmw-fastrtps-cpp
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --no-deps rowan==1.3.2
      - name: Fetch pinned dependencies and apply exact patches
        run: /usr/bin/python3 scripts/fetch_dependencies.py
      - name: Resolve selected ROS/system dependencies
        shell: bash
        run: bash scripts/resolve_dependencies.sh
      - name: Build this edition and backend
        shell: bash
        run: bash scripts/build.sh
      - name: Verify imports and binaries without starting hardware
        shell: bash
        run: bash scripts/verify.sh --ros
      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-logs
          path: log/
