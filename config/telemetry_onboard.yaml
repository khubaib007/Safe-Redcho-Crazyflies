enabled: true
blocks:
  telemetry_kinematics:
    enabled: true
    recorder: flight
    frame: world
    frequency: 10
    vars:
    - stateEstimate.vx
    - stateEstimate.vy
    - stateEstimate.vz
    - stateEstimate.ax
    - stateEstimate.ay
    - stateEstimate.az
    fields:
    - velocity_mps.x
    - velocity_mps.y
    - velocity_mps.z
    - acceleration_raw_g.x
    - acceleration_raw_g.y
    - acceleration_raw_g.z
    acceleration_scale_mps2_per_raw: 9.80665
  telemetry_gyro:
    enabled: false
    recorder: flight
    frame: body
    frequency: 10
    vars:
    - gyro.x
    - gyro.y
    - gyro.z
    fields:
    - gyro_deg_per_s.x
    - gyro_deg_per_s.y
    - gyro_deg_per_s.z
  telemetry_target_pv:
    enabled: false
    recorder: control
    frequency: 5
    vars:
    - ctrltarget.x
    - ctrltarget.y
    - ctrltarget.z
    - ctrltarget.vx
    - ctrltarget.vy
    - ctrltarget.vz
    fields:
    - position_m.x
    - position_m.y
    - position_m.z
    - velocity_mps.x
    - velocity_mps.y
    - velocity_mps.z
  telemetry_target_a:
    enabled: false
    recorder: control
    frequency: 5
    vars:
    - ctrltarget.ax
    - ctrltarget.ay
    - ctrltarget.az
    fields:
    - acceleration_mps2.x
    - acceleration_mps2.y
    - acceleration_mps2.z
